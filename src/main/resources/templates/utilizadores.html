<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Utilizadores</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
  <h1>Restaurante - Gestão de Utilizadores</h1>

  <!-- Botão -->
  <div style="margin-bottom: 20px;">
    <a href="/registar-utilizador" class="btn" style="display: inline-block; padding: 10px 20px; background-color: #d9534f; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">+ Adicionar Novo Funcionário</a>
  </div>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Nome Completo</th>
      <th>Email</th>
      <th>Função</th>
    </tr>
    </thead>
    <tbody>
    <!-- Percorre a lista de utilizadores enviada pelo Controller -->
    <tr th:each="utilizador : ${utilizadores}">
      <td th:text="${utilizador.id}">1</td>
      <td th:text="${utilizador.nomeCompleto}">Nome Exemplo</td>
      <td th:text="${utilizador.email}">email@exemplo.com</td>
      <td>
        <span class="badge badge-livre" th:text="${utilizador.funcao}">Função</span>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
