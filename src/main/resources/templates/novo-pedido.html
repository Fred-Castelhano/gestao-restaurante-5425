<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar Pedido</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container container-novo-pedido">
    <h1>Criar Pedido</h1>
    <h3 class="subtitulo-mesa" th:text="'Mesa: ' + ${mesa.numero}">Mesa</h3>

    <form th:action="@{/pedidos/guardar}" method="post" class="form-card">
        <input type="hidden" name="idMesa" th:value="${mesa.idMesa}">

        <p class="label-seccao">Selecione as quantidades para cada prato:</p>

        <div class="lista-pratos-container">
            <div th:each="prato : ${pratos}" class="prato-item-linha">
                <div class="prato-info-detalhe">
                    <span class="prato-nome" th:text="${prato.nome}">Prato</span>
                    <span class="prato-preco-unitario" th:text="${prato.preco} + '€'">0€</span>
                </div>

                <div class="controlo-quantidade">
                    <!-- Input de quantidade associado ao preço para cálculo automático -->
                    <input type="number"
                           th:name="|quantidades[${prato.idPrato}]|"
                           value="0"
                           min="0"
                           max="20"
                           class="input-quantidade"
                           th:data-preco="${prato.preco}"
                           oninput="calcularTotal()">
                </div>
            </div>

            <div th:if="${#lists.isEmpty(pratos)}" class="tabela-vazia">
                Nenhum prato disponível no momento.
            </div>
        </div>

        <!-- Resumo do Total Acumulado -->
        <div class="resumo-total-container">
            <span>Total da Mesa (Acumulado):</span>
            <!-- Input oculto para guardar o valor base que já vinha da BD -->
            <input type="hidden" id="totalAcumuladoInicial" th:value="${totalAcumulado}" />
            <span id="valorTotal" class="valor-total-destaque" th:text="${totalAcumulado != null ? #numbers.formatDecimal(totalAcumulado, 1, 2) : '0.00'} + '€'">0.00€</span>
        </div>

        <div class="form-submit" style="display: flex; gap: 10px;">
            <button type="submit" class="btn-guardar btn-enviar-pedido" style="flex: 1;">
                Enviar Pedido para a Cozinha
            </button>

            <!-- Botão Partir para Pagamento -->
            <a th:href="@{/pedidos/pagamento(idMesa=${mesa.idMesa})}" class="btn-guardar" style="background-color: #d97706; text-align: center; text-decoration: none; flex: 1; display: flex; align-items: center; justify-content: center;">
                Partir para Pagamento
            </a>
        </div>
    </form>

    <div class="voltar-link">
        <a th:href="@{/pedidos/cozinha}">← Voltar à Cozinha</a>
    </div>
</div>

<!-- Script para calcular o total somando o acumulado inicial e os novos inputs -->
<script>
    function calcularTotal() {
        let acumuladoInicial = parseFloat(document.getElementById('totalAcumuladoInicial').value) || 0;
        let totalAdicional = 0;
        const inputs = document.querySelectorAll('.input-quantidade');

        inputs.forEach(input => {
            const quantidade = parseInt(input.value) || 0;
            const preco = parseFloat(input.getAttribute('data-preco')) || 0;
            totalAdicional += quantidade * preco;
        });

        let totalFinal = acumuladoInicial + totalAdicional;
        document.getElementById('valorTotal').innerText = totalFinal.toFixed(2) + '€';
    }
</script>

</body>
</html>
