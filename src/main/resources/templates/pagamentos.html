<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Pagamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="text-center mb-4">Caixa / Pagamentos por Mesa</h1>

    <div class="text-end mb-3">
        <a href="/pedidos/cozinha" class="btn btn-secondary">Voltar à Cozinha</a>
    </div>

    <div class="row">
        <!-- Iterar sobre cada mesa -->
        <div class="col-md-4 mb-4" th:each="mesa : ${mesas}">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" th:text="'Mesa ' + ${mesa.idMesa}">Mesa</h5>
                    <span class="badge bg-light text-dark" th:text="${mesa.estado}">Livre</span>
                </div>

                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h6 class="text-muted mb-3">Itens Consumidos:</h6>

                        <!-- Lista de itens da mesa -->
                        <ul class="list-group mb-3">
                            <li class="list-group-item d-flex justify-content-between align-items-center"
                                th:each="item : ${itensPorMesa.get(mesa.idMesa)}">
                                <span th:text="${item.nomeProduto}">Produto</span>
                                <span class="badge bg-secondary" th:text="${item.quantidade}">1</span>
                            </li>
                            <!-- Mensagem caso esteja vazio -->
                            <li class="list-group-item text-muted text-center"
                                th:if="${#lists.isEmpty(itensPorMesa.get(mesa.idMesa))}">
                                Sem pedidos pendentes
                            </li>
                        </ul>
                    </div>

                    <!-- Valor total e botão de pagamento -->
                    <div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Total:</h5>
                            <h4 class="text-success mb-0" th:text="${#numbers.formatDecimal(totaisPorMesa.get(mesa.idMesa), 1, 2) + ' €'}">0.00 €</h4>
                        </div>

                        <form th:action="@{/pedidos/pagamento}" method="get">
                            <input type="hidden" name="idMesa" th:value="${mesa.idMesa}" />
                            <button type="submit" class="p-2 btn btn-success w-100"
                                    th:disabled="${#lists.isEmpty(itensPorMesa.get(mesa.idMesa))}">
                                Efetuar Pagamento
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
